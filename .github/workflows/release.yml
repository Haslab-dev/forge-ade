name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native:
    name: Native bundle (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build .app bundle
        run: make native-app

      - name: Zip bundle
        run: ditto -c -k --keepParent dist/forge-native.app ForgeADE-Native-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: forge-native
          path: ForgeADE-Native-${{ github.ref_name }}.zip

  webview:
    name: Webview package (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: app/webview/frontend
        run: bun install --frozen-lockfile

      - name: Package Wails app
        working-directory: app/webview
        run: $(go env GOPATH)/bin/wails3 package || npx wails3 package

      - uses: actions/upload-artifact@v4
        with:
          name: forge-webview
          path: app/webview/build/bin/*.app

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [native, webview]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
