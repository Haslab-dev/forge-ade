name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native:
    name: Native bundle (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build .app bundle
        run: make native-app

      - name: Zip bundle
        run: ditto -c -k --keepParent build/ForgeADE.app ForgeADE-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: forge-ade
          path: ForgeADE-${{ github.ref_name }}.zip


  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [native]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: build

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: build/*
