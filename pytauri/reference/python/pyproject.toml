[project]
name = "tauri-app-wheel"
version = "0.1.0"
description = "PyTauri-Wheel reference app for the ForgeADE migration"
requires-python = ">=3.9"
dependencies = [
    "pydantic == 2.*",
    "anyio == 4.*",
    "pytauri == 0.8.*",
    "pytauri-wheel == 0.8.*",
]

[project.optional-dependencies]
dev = [
    "jurigged",
    "pyinstaller",
]

[project.scripts]
tauri-app-wheel-console = "tauri_app_wheel:main"

[project.gui-scripts]
tauri-app-wheel = "tauri_app_wheel:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The frontend dist is generated by vite into the package dir; include it in
# the sdist/wheel (see https://hatch.pypa.io/latest/config/build/#artifacts).
artifacts = ["src/tauri_app_wheel/frontend/"]
